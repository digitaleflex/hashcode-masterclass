name: Signaler un problème
description: Signaler une erreur pédagogique, technique ou de navigation.
title: "[BUG] "
body:
  - type: dropdown
    id: category
    attributes:
      label: Catégorie
      options:
        - Erreur pédagogique ou technique
        - Lien cassé
        - Problème de présentation HTML
        - Exercice ou correction
        - Accessibilité
        - CI ou script
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: Fichier et emplacement
      description: Indiquer le chemin, la section ou la diapositive.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Comportement observé
    validations:
      required: true
