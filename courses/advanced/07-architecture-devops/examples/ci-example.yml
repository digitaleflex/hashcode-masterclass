name: Example CI for a small Node.js service

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test courses/advanced/07-architecture-devops/examples/health.test.mjs
      - run: node --check courses/advanced/07-architecture-devops/examples/server.mjs
