<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DOM sûr — HashCode Academy</title></head>
<body>
  <main>
    <h1>Afficher une valeur comme texte</h1>
    <label for="value">Texte à afficher</label>
    <input id="value" value="Bonjour">
    <button id="render" type="button">Afficher</button>
    <p id="output" aria-live="polite"></p>
  </main>
  <script type="module">
    const input = document.querySelector("#value");
    const output = document.querySelector("#output");
    document.querySelector("#render").addEventListener("click", () => {
      output.textContent = input.value;
    });
  </script>
</body>
</html>
