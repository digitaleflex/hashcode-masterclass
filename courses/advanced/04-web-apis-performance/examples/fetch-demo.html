<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Fetch local — HashCode Academy</title></head>
<body>
  <main>
    <h1>Recherche locale</h1>
    <label for="query">Rechercher une tâche</label>
    <input id="query" type="search" autocomplete="off">
    <p id="status" role="status" aria-live="polite">Saisir un terme.</p>
    <ul id="results"></ul>
  </main>
  <script type="module">
    const tasks = ["Étudier les closures", "Tester une API", "Documenter une release", "Auditer les permissions"];
    const input = document.querySelector("#query");
    const status = document.querySelector("#status");
    const list = document.querySelector("#results");
    let latest = 0;
    input.addEventListener("input", () => {
      const requestId = ++latest;
      status.textContent = "Recherche…";
      queueMicrotask(() => {
        if (requestId !== latest) return;
        const query = input.value.trim().toLocaleLowerCase("fr");
        const matches = tasks.filter(task => task.toLocaleLowerCase("fr").includes(query));
        list.replaceChildren(...matches.map(task => {
          const li = document.createElement("li");
          li.textContent = task;
          return li;
        }));
        status.textContent = matches.length ? `${matches.length} résultat(s)` : "Aucun résultat.";
      });
    });
  </script>
</body>
</html>
